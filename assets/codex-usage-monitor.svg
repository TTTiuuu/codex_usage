<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Codex Usage Monitor</title>
  <defs>
    <linearGradient id="usage-bg" x1="20" y1="14" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182331"/>
      <stop offset="1" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="usage-ring" x1="31" y1="95" x2="103" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52F2B8"/>
      <stop offset=".48" stop-color="#42D7FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="usage-bars" x1="44" y1="86" x2="85" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55F3B9"/>
      <stop offset="1" stop-color="#52B9FF"/>
    </linearGradient>
    <filter id="usage-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <filter id="usage-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <rect x="7" y="7" width="114" height="114" rx="28" fill="url(#usage-bg)" filter="url(#usage-shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
  <circle cx="64" cy="64" r="39" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="8"/>
  <circle cx="64" cy="64" r="39" fill="none" stroke="url(#usage-ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="188 58" transform="rotate(-90 64 64)"/>
  <circle cx="96" cy="41" r="5" fill="#8B7CFF" opacity=".6" filter="url(#usage-glow)"/>
  <rect x="43" y="65" width="9" height="21" rx="4.5" fill="url(#usage-bars)"/>
  <rect x="59.5" y="52" width="9" height="34" rx="4.5" fill="url(#usage-bars)"/>
  <rect x="76" y="41" width="9" height="45" rx="4.5" fill="url(#usage-bars)"/>
  <path d="M42 94H86" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
</svg>
